name: Daily Intelligence Scraper

on:
  schedule:
    # Runs every day at 12:00 UTC (8:00 AM EDT)
    - cron: '0 12 * * *'
  workflow_dispatch: # Allows manual trigger

jobs:
  run-scraper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      - name: Set up Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests feedparser beautifulsoup4 pandas

      - name: Execute Monitoring Script
        run: python newsjackking_test.py

      - name: Upload Daily Report as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: daily-intelligence-report
          path: reports/*.md
          retention-days: 90
